function exportToExcel() {
  try {
    // Prepare data for Excel
    var wsData = [];
    
    // Header row
    wsData.push(['ID', 'Title', 'Description', 'Project', 'Assignee', 'Assigned By', 'Priority', 'Status', 'Progress (%)', 'Deadline', 'Created', 'Comments']);
    
    // Helper: flatten task.comments array into a readable string
    function flattenComments(comments) {
      if (!comments || !comments.length) return '';
      return comments.map(function(c) {
        try {
          var obj = typeof c === 'string' ? JSON.parse(c) : c;
          var parts = [];
          if (obj.author) parts.push(obj.author);
          if (obj.text)   parts.push(obj.text);
          if (obj.timestamp) parts.push('[' + obj.timestamp + ']');
          return parts.join(': ');
        } catch(e) {
          return String(c);
        }
      }).join(' | ');
    }

    // Task rows
    var filteredTasks = getActiveFilteredTasks();
    if (!filteredTasks || !filteredTasks.length) {
      showToast('No tasks to export', 'warning');
      return;
    }

    filteredTasks.forEach(function(task) {
      wsData.push([
        task.id || '',
        task.title || '',
        task.desc || '',
        task.project || '',
        getUserDisplayName(task.assignee),
        getUserDisplayName(task.assignedBy),
        task.priority || '',
        task.status || '',
        task.progress !== undefined ? Number(task.progress) : 0,
        task.deadline || '',
        task.created || '',
        flattenComments(task.comments)
      ]);
    });
    
    // Create workbook and worksheet
    var ws = XLSX.utils.aoa_to_sheet(wsData);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Tasks");
    
    // Set column widths properly
    ws['!cols'] = [
      { wch: 8 },
      { wch: 25 },
      { wch: 30 },
      { wch: 20 },
      { wch: 15 },
      { wch: 15 },
      { wch: 12 },
      { wch: 12 },
      { wch: 12 },
      { wch: 12 },
      { wch: 12 },
      { wch: 40 }
    ];
    
    // Generate timestamp for filename
    var timestamp = new Date().toISOString().split('T')[0];
    var wbout = XLSX.write(wb, {bookType:'xlsx',  type: 'binary'});
    function s2ab(s) {
      var buf = new ArrayBuffer(s.length);
      var view = new Uint8Array(buf);
      for (var i=0; i<s.length; i++) view[i] = s.charCodeAt(i) & 0xFF;
      return buf;
    }
    
    var blob = new Blob([s2ab(wbout)], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = 'Aarcon_Tasks_' + timestamp + '.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    
    showToast('Tasks exported to Excel', 'success');
  } catch(err) {
    showToast('Export failed: ' + err.message, 'error');
  }
}

function exportToPDF() {
  try {
    var element = document.createElement('div');
    element.style.padding = '20px';
    element.style.fontFamily = 'Arial, sans-serif';
    element.style.fontSize = '11px';
    element.style.color = '#000';
    element.style.backgroundColor = '#fff';
    
    // Title
    var title = document.createElement('h1');
    title.textContent = 'Aarcon — Tasks Report';
    title.style.fontSize = '24px';
    title.style.marginBottom = '10px';
    title.style.textAlign = 'center';
    element.appendChild(title);
    
    // Timestamp
    var timestamp = document.createElement('p');
    timestamp.textContent = 'Generated: ' + new Date().toLocaleString();
    timestamp.style.fontSize = '10px';
    timestamp.style.textAlign = 'center';
    timestamp.style.marginBottom = '20px';
    timestamp.style.color = '#666';
    element.appendChild(timestamp);
    
    // Create table
    var table = document.createElement('table');
    table.style.width = '100%';
    table.style.borderCollapse = 'collapse';
    table.style.marginTop = '10px';
    
    // Table header
    var thead = document.createElement('thead');
    var headerRow = document.createElement('tr');
    headerRow.style.backgroundColor = '#f0f0f0';
    headerRow.style.fontWeight = 'bold';
    
    var headers = ['ID', 'Title', 'Project', 'Assignee', 'Assigned By', 'Priority', 'Status', 'Progress', 'Deadline', 'Comments'];
    headers.forEach(function(header) {
      var th = document.createElement('th');
      th.textContent = header;
      th.style.border = '1px solid #ccc';
      th.style.padding = '8px';
      th.style.textAlign = 'left';
      th.style.fontSize = '10px';
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    // Helper: flatten comments to readable string for PDF
    function flattenCommentsPdf(comments) {
      if (!comments || !comments.length) return '';
      return comments.map(function(c) {
        try {
          var obj = typeof c === 'string' ? JSON.parse(c) : c;
          var parts = [];
          if (obj.author) parts.push(obj.author);
          if (obj.text)   parts.push(obj.text);
          if (obj.timestamp) parts.push('[' + obj.timestamp + ']');
          return parts.join(': ');
        } catch(e) {
          return String(c);
        }
      }).join(' | ');
    }
    
    // Table body
    var tbody = document.createElement('tbody');
    getActiveFilteredTasks().forEach(function(task, idx) {
      var row = document.createElement('tr');
      row.style.backgroundColor = idx % 2 === 0 ? '#ffffff' : '#f9f9f9';
      
      var cells = [
        task.id || '',
        task.title || '',
        task.project || '',
        task.assignee || '',
        task.assignedBy || '',
        task.priority || '',
        task.status || '',
        (task.progress || 0) + '%',
        task.deadline || '',
        flattenCommentsPdf(task.comments)
      ];
      
      cells.forEach(function(cell, cellIdx) {
        var td = document.createElement('td');
        td.textContent = cell;
        td.style.border = '1px solid #ccc';
        td.style.padding = '6px';
        td.style.fontSize = '9px';
        // Give comments column extra width and allow wrapping
        if (cellIdx === cells.length - 1) {
          td.style.minWidth = '120px';
          td.style.maxWidth = '200px';
          td.style.wordBreak = 'break-word';
          td.style.whiteSpace = 'normal';
        }
        row.appendChild(td);
      });
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    element.appendChild(table);
    
    // Generate PDF
    var timestamp = new Date().toISOString().split('T')[0];
    var opt = {
      margin: 10,
      filename: 'Aarcon_Tasks_' + timestamp + '.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2 },
      jsPDF: { orientation: 'landscape', unit: 'mm', format: 'a4' }
    };
    
    html2pdf().set(opt).from(element).save();
    showToast('Tasks exported to PDF', 'success');
  } catch(err) {
    showToast('PDF export failed: ' + err.message, 'error');
  }
}

let reportCurrentStatusFilter = 'All';
let reportCurrentSearchQuery = '';

function handleReportEmployeeChange(username) {
  reportCurrentStatusFilter = 'All';
  reportCurrentSearchQuery = '';
  updateReportDisplay(username);
}

function updateReportDisplay(username) {
  var userObj = USERS.find(function(u) { return u.username === username; });
  if (!userObj) return;

  var userTasks = tasks.filter(function(t) { return t.assignee === username; });
  var total = userTasks.length;
  
  var pending = userTasks.filter(function(t) { return t.status === 'Pending'; }).length;
  var inProgress = userTasks.filter(function(t) { return t.status === 'In Progress'; }).length;
  var underReview = userTasks.filter(function(t) { return t.status === 'Under Review'; }).length;
  var completed = userTasks.filter(function(t) { return t.status === 'Completed'; }).length;
  var overdue = userTasks.filter(function(t) { return t.status === 'Overdue'; }).length;
  
  var active = pending + inProgress + underReview;
  var completionRate = total ? Math.round((completed / total) * 100) : 0;
  
  // Calculate average progress
  var sumProgress = 0;
  userTasks.forEach(function(t) {
    var p = parseInt(t.progress);
    if (!isNaN(p)) sumProgress += p;
  });
  var avgProgress = total ? Math.round(sumProgress / total) : 0;

  var displayArea = document.getElementById('reportDisplayArea');
  if (!displayArea) return;
  
  // Ensure the display area style class is clean
  displayArea.className = 'fade-up';
  displayArea.style.animationDelay = '0.1s';
  displayArea.style.border = 'none';
  displayArea.style.background = 'none';
  displayArea.style.padding = '0';


  // Employee Profile Card
  var profileCard = 
    '<div class="p-6 rounded-2xl bg-base-900 border border-base-800 flex flex-col sm:flex-row gap-4 items-center sm:items-start text-center sm:text-left mb-6 relative overflow-hidden">' +
      '<div class="w-20 h-20 rounded-2xl flex items-center justify-center text-2xl font-bold text-base-950 shadow-sm shrink-0 overflow-hidden" style="background:' + (userObj.photo ? 'none' : userObj.color) + '">' +
        (userObj.photo ? '<img src="' + userObj.photo + '" class="w-full h-full object-cover">' : userObj.initials) +
      '</div>' +
      '<div class="flex-1 min-w-0">' +
        '<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">' +
          '<div>' +
            '<h2 class="font-display font-bold text-lg leading-snug propercase tracking-tight">' + userObj.name + '</h2>' +
            '<p class="text-xs text-base-500 font-medium mt-0.5">' + userObj.role + ' &bull; ' + userObj.department + '</p>' +
          '</div>' +
          '<div class="flex flex-col items-center sm:items-end text-xs text-base-500 gap-0.5 shrink-0">' +
            (userObj.email ? '<p class="flex items-center gap-1.5"><i class="fas fa-envelope text-[10px] text-base-500"></i> ' + userObj.email + '</p>' : '') +
            (userObj.mobile ? '<p class="flex items-center gap-1.5 mt-0.5"><i class="fas fa-phone text-[10px] text-base-500"></i> ' + userObj.mobile + '</p>' : '') +
          '</div>' +
        '</div>' +
        '<div class="flex flex-wrap gap-2.5 mt-3.5 pt-3.5 border-t border-base-800/60 justify-center sm:justify-start">' +
          '<span class="px-2.5 py-1 text-[10px] font-bold rounded-lg bg-base-950 text-base-400 border border-base-800 flex items-center gap-1"><i class="fas fa-user-tie text-[9px]"></i> Manager: ' + (userObj.manager || 'Rajeev') + '</span>' +
          '<span class="px-2.5 py-1 text-[10px] font-bold rounded-lg bg-base-950 text-amber-500 border border-base-800 flex items-center gap-1"><i class="fas fa-building text-[9px]"></i> Project: ' + (userObj.project || 'Unassigned') + '</span>' +
        '</div>' +
      '</div>' +
    '</div>';

  // Stat Metrics Grid
  var metricsGrid = 
    '<div class="grid grid-cols-3 sm:grid-cols-5 gap-2 sm:gap-4 mb-6">' +
      statCardSmall('fa-list-check', 'Total Tasks', total) +
      statCardSmall('fa-bolt', 'Active Tasks', active) +
      statCardWithRate('fa-circle-check', 'Completed', completed, completionRate + '% Rate') +
      statCardOverdue('fa-triangle-exclamation', 'Overdue', overdue) +
      statCardProgress('fa-chart-pie', 'Avg Progress', avgProgress) +
    '</div>';

  // Task Filter and Table controls
  var taskListControls = 
    '<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4 bg-base-900 border border-base-800 p-4 rounded-xl">' +
      '<div class="flex flex-wrap gap-1.5">' +
        renderReportStatusFilterBtn('All', 'All Tasks', total, username) +
        renderReportStatusFilterBtn('Pending', 'Pending', pending, username) +
        renderReportStatusFilterBtn('In Progress', 'Active', inProgress, username) +
        renderReportStatusFilterBtn('Under Review', 'Review', underReview, username) +
        renderReportStatusFilterBtn('Completed', 'Completed', completed, username) +
        renderReportStatusFilterBtn('Overdue', 'Overdue', overdue, username) +
      '</div>' +
      '<div class="relative min-w-[200px] flex-1 md:max-w-[280px] hidden sm:block">' +
        '<i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-base-500 text-xs"></i>' +
        '<input type="text" id="reportTaskSearch" value="' + reportCurrentSearchQuery + '" placeholder="Search this employee\'s tasks..." class="pl-9 pr-4 py-2 rounded-lg text-xs w-full bg-base-950 border border-base-800 text-base-200" oninput="handleReportTaskSearch(this.value, \'' + username + '\')">' +
      '</div>' +
    '</div>';

  // Task Table/List
  var filteredTasks = userTasks.filter(function(t) {
    // Status Filter
    if (reportCurrentStatusFilter !== 'All') {
      if (reportCurrentStatusFilter === 'In Progress' && t.status !== 'In Progress') return false;
      else if (reportCurrentStatusFilter !== 'In Progress' && t.status !== reportCurrentStatusFilter) return false;
    }
    
    // Search Query
    if (reportCurrentSearchQuery) {
      var query = reportCurrentSearchQuery.toLowerCase();
      var matchTitle = (t.title || '').toLowerCase().indexOf(query) !== -1;
      var matchDesc = (t.desc || '').toLowerCase().indexOf(query) !== -1;
      var matchProject = (t.project || '').toLowerCase().indexOf(query) !== -1;
      if (!matchTitle && !matchDesc && !matchProject) return false;
    }
    
    return true;
  });

  var tableHtml = '';
  if (filteredTasks.length === 0) {
    tableHtml = 
      '<div class="flex flex-col items-center justify-center py-16 text-center bg-base-900 border border-base-800 rounded-2xl">' +
        '<div class="w-12 h-12 rounded-full bg-base-800 flex items-center justify-center text-base-500 mb-3">' +
          '<i class="fas fa-folder-open text-lg"></i>' +

        '<p class="text-xs text-base-400 font-semibold">No tasks match your selection</p>' +
        '<p class="text-[10px] text-base-500 mt-1 max-w-[220px]">This employee does not have any tasks that match the active filters or search query.</p>' +
      '</div>';
  } else {
    var rowsHtml = filteredTasks.map(function(t) {
      var pBarColor = 'var(--accent)';
      if (t.status === 'Completed') pBarColor = '#10b981';
      else if (t.status === 'Overdue') pBarColor = '#ef4444';
      else if (t.status === 'Under Review') pBarColor = '#f59e0b';
      
      var priorityHtml = '';
      if (t.priority === 'High') {
        priorityHtml = '<span class="px-1.5 py-0.5 rounded text-[8px] font-bold tracking-wider priority-high">High</span>';
      } else if (t.priority === 'Medium') {
        priorityHtml = '<span class="px-1.5 py-0.5 rounded text-[8px] font-bold tracking-wider priority-medium">Med</span>';

      if (commentCount > 0) {

          'title="Show comments">' +
          '<i class="fas fa-plus text-[8px]"></i>' +
          '<span>' + commentCount + '</span>' +
          '</button>';

        var commentItems = comments.map(function(c, idx) {
          var author = 'System';
          var ts = '';
          var txt = typeof c === 'string' ? c : (c.text || '');
          if (typeof c === 'string') {
            try {
              var parsed = JSON.parse(c);
              if (parsed && parsed.text) {
                author = parsed.author || parsed.username || 'Unknown';
                ts = parsed.timestamp || '';
                txt = parsed.text;
              }
            } catch(e) {
              var colonIdx = c.indexOf(':');
              if (colonIdx > 0 && colonIdx < 30) {
                author = c.substring(0, colonIdx).trim();
                txt = c.substring(colonIdx + 1).trim();
              }

          } else if (typeof c === 'object' && c !== null) {
            author = c.author || c.username || 'Unknown';

               '<td class="py-3 px-4 text-center"><span class="px-2 py-0.5 text-[9px] rounded-full ' + getStatusClass(t.status) + '">' + t.status + '</span></td>' +
               '<td class="py-3 px-4 text-center">' + priorityHtml + '</td>' +
               '<td class="py-3 px-4">' +
                 '<div class="flex items-center gap-2">' +
                   '<div class="flex-1 bg-base-800 h-1.5 rounded-full overflow-hidden min-w-[50px]">' +
                     '<div class="h-full rounded-full" style="width:' + t.progress + '%; background-color:' + pBarColor + '"></div>' +
                   '</div>' +
                   '<span class="text-[10px] text-base-400 font-semibold">' + t.progress + '%</span>' +

    // Inject toggleReportComments helper if not already defined

        '<div class="overflow-x-auto overflow-y-auto max-h-[400px] relative">' +

            '<thead class="sticky-thead">' +

                '<th class="py-2.5 px-4">Progress</th>' +
                '<th class="py-2.5 px-4 text-center">Deadline</th>' +

            '</thead>' +
            '<tbody class="divide-y divide-base-800/40 bg-base-900/20">' +
              rowsHtml +
            '</tbody>' +
          '</table>' +
        '</div>' +
      '</div>';
  }

  displayArea.innerHTML = 
    profileCard +
    metricsGrid +
    taskListControls +
    tableHtml;
}

  var isActive = reportCurrentStatusFilter === status;
  var baseClass = 'px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 ';
  var activeClass = isActive 
    ? 'bg-amber-500 text-base-950 font-bold shadow-md shadow-amber-500/10 border border-amber-500' 
    : 'bg-base-950 hover:bg-base-800 text-base-400 border border-base-800';
  
  return '<button onclick="handleReportStatusFilter(\'' + status + '\', \'' + username + '\')" class="' + baseClass + activeClass + '">' +
           label + ' <span class="px-1.5 py-0.5 rounded-full text-[10px] ' + (isActive ? 'bg-base-950/20 text-base-950' : 'bg-base-800 text-base-500') + '">' + count + '</span>' +
         '</button>';
}

function handleReportStatusFilter(status, username) {
  reportCurrentStatusFilter = status;
  updateReportDisplay(username);
}

function handleReportTaskSearch(query, username) {
  reportCurrentSearchQuery = query;
  updateReportDisplay(username);
}

function statCardWithRate(icon, title, val, rateLabel) {
  return '<div class="p-2 sm:p-4 rounded-xl sm:rounded-2xl bg-base-900 border border-base-800 flex items-center gap-2 sm:gap-3.5 relative overflow-hidden">' +
           '<div class="w-7 h-7 sm:w-10 sm:h-10 rounded-lg sm:rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-500 text-[10px] sm:text-sm shrink-0"><i class="fas ' + icon + '"></i></div>' +
           '<div class="min-w-0">' +
             '<h4 class="text-sm sm:text-xl font-bold font-display text-base-100 leading-tight">' + val + '</h4>' +
             '<p class="text-[9px] sm:text-[10px] text-base-500 font-semibold propercase tracking-wider mt-0 sm:mt-0.5">' + title + '</p>' +
             '<span class="absolute top-1 sm:top-2 right-1 sm:right-2 px-1 sm:px-1.5 py-0.5 text-[7px] sm:text-[8px] font-bold rounded bg-emerald-500/10 text-emerald-500 border border-emerald-500/10">' + rateLabel + '</span>' +
           '</div>' +
         '</div>';
}

function statCardOverdue(icon, title, val) {
  var isOverdue = val > 0;
  var bg = isOverdue ? 'bg-red-500/5' : 'bg-base-900';
  var border = isOverdue ? 'border-red-500/20' : 'border-base-800';
  var text = isOverdue ? 'text-red-400' : 'text-base-100';
  var iconBg = isOverdue ? 'bg-red-500/10 text-red-500' : 'bg-base-800 text-base-500';
  
  return '<div class="p-2 sm:p-4 rounded-xl sm:rounded-2xl ' + bg + ' border ' + border + ' flex items-center gap-2 sm:gap-3.5 relative overflow-hidden">' +
           '<div class="w-7 h-7 sm:w-10 sm:h-10 rounded-lg sm:rounded-xl ' + iconBg + ' flex items-center justify-center text-[10px] sm:text-sm shrink-0"><i class="fas ' + icon + '"></i></div>' +
           '<div class="min-w-0">' +
             '<h4 class="text-sm sm:text-xl font-bold font-display ' + text + ' leading-tight">' + val + '</h4>' +
             '<p class="text-[9px] sm:text-[10px] text-base-500 font-semibold propercase tracking-wider mt-0 sm:mt-0.5">' + title + '</p>' +
           '</div>' +
         '</div>';
}

function statCardProgress(icon, title, val) {
  return '<div class="p-2 sm:p-4 rounded-xl sm:rounded-2xl bg-base-900 border border-base-800 flex items-center gap-2 sm:gap-3.5 relative overflow-hidden">' +
           '<div class="w-7 h-7 sm:w-10 sm:h-10 rounded-lg sm:rounded-xl bg-blue-500/10 flex items-center justify-center text-blue-500 text-[10px] sm:text-sm shrink-0"><i class="fas ' + icon + '"></i></div>' +
           '<div class="min-w-0 flex-1">' +
             '<h4 class="text-sm sm:text-lg font-bold font-display text-base-100 leading-tight">' + val + '%</h4>' +
             '<p class="text-[9px] sm:text-[10px] text-base-500 font-semibold propercase tracking-wider mt-0 sm:mt-0.5">' + title + '</p>' +
             '<div class="w-full bg-base-800 h-0.5 sm:h-1 rounded-full overflow-hidden mt-0.5 sm:mt-1.5">' +
               '<div class="bg-blue-500 h-full rounded-full" style="width:' + val + '%"></div>' +
             '</div>' +
           '</div>' +
         '</div>';
}

// Toggle expandable comments row in Reports table
function toggleReportComments(rowId, btn, event) {
  if (event) { event.stopPropagation(); }
  var row = document.getElementById(rowId);
  if (!row) return;
  var isOpen = row.style.display !== 'none';
  row.style.display = isOpen ? 'none' : 'table-row';
  // Toggle icon between + and −
  var icon = btn ? btn.querySelector('i') : null;
  if (icon) {
    icon.className = isOpen ? 'fas fa-plus text-[8px]' : 'fas fa-minus text-[8px]';
  }
  // Toggle button colour
  if (btn) {
    if (isOpen) {
      btn.classList.remove('bg-amber-500/30', 'border-amber-500/40');
      btn.classList.add('bg-amber-500/10', 'border-amber-500/20');
    } else {
      btn.classList.remove('bg-amber-500/10', 'border-amber-500/20');
      btn.classList.add('bg-amber-500/30', 'border-amber-500/40');
    }
  }
}
