<script>
// ####################################################
// AARCON — GOOGLE SHEET CONNECTED VERSION
// ####################################################

// --- THEME MANAGEMENT ---
function initTheme() {
  var savedTheme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeUI(savedTheme);
}

function toggleTheme() {
  var currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
  var newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  updateThemeUI(newTheme);
}

function updateThemeUI(theme) {
  var icon = document.getElementById('themeToggleIcon');
  if (icon) {
    if (theme === 'light') {
      icon.className = 'fas fa-moon text-sm';
      icon.style.color = '#6086a4';
    } else {
      icon.className = 'fas fa-sun text-sm';
      icon.style.color = '#f59e0b';
    }
  }
  // Update meta theme-color for mobile browsers
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'light' ? '#f0f5fb' : '#090f18');
}

// Run immediately to apply styling before rendering
initTheme();

// --- DATA FROM GOOGLE SHEET (loaded on startup) ---
let USERS = [];
let PROJECTS_LIST = [];
let tasks = [];
let nextTaskId = 1;

// --- ATTACHMENT STATE ---
let taskAttachmentsCache = {};

function taskHasAttachments(taskId) {
  return taskAttachmentsCache[taskId] && taskAttachmentsCache[taskId].length > 0;
}

function isTaskCompleted(task) {
  if (!task) return false;
  return String(task.status || '').trim() === 'Completed';
}

function updateDetailEditButtonState(taskId) {
  var btn = document.getElementById('detailEditTaskBtn');
  if (!btn) return;
  var t = findTaskById(taskId);
  var hasAttachments = taskHasAttachments(taskId);
  var completed = isTaskCompleted(t);
  var disableEdit = hasAttachments || completed;

  btn.disabled = disableEdit;
  if (disableEdit) {
    btn.classList.add('opacity-50', 'cursor-not-allowed');
    btn.title = completed ? 'Completed tasks cannot be edited' : 'Task has attachments and cannot be edited';
  } else {
    btn.classList.remove('opacity-50', 'cursor-not-allowed');
    btn.title = 'Edit Task';
  }
}

// --- SESSION STATE ---
let currentUser = null;
let currentView = 'dashboard';
let filterScope = 'Team';
let currentSortColumn = 'id';
let currentSortOrder = 'asc';

function handleScopeChange(val) {
  filterScope = val;
  renderView();
}
function handleSort(col) {
  if (currentSortColumn === col) {
    currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
  } else {
    currentSortColumn = col;
    currentSortOrder = 'asc';
  }
  renderView();
}
function renderSortHeader(colName, displayName) {
  var isSorted = currentSortColumn === colName;
  var icon = '<i class="fas fa-sort text-base-600/30 ml-1.5 transition-colors group-hover:text-base-400 text-[9px]"></i>';
  if (isSorted) {
    if (currentSortOrder === 'asc') {
      icon = '<i class="fas fa-chevron-up text-sky-400 ml-1.5 font-bold text-[9px]"></i>';
    } else {
      icon = '<i class="fas fa-chevron-down text-sky-400 ml-1.5 font-bold text-[9px]"></i>';
    }
  }
  return '<th onclick="handleSort(\'' + colName + '\')" class="px-3 py-3 cursor-pointer select-none group hover:text-base-200 transition-colors">' +
    '<div class="flex items-center">' +
      displayName + icon +
    '</div>' +
  '</th>';
}
function resetTaskFilters() {
  searchQuery = '';
  filterStatus = 'All';
  filterPriority = 'All';
  filterProject = 'All';
  filterScope = 'Team';
  currentSortColumn = 'id';
  currentSortOrder = 'asc';
  var searchInput = document.getElementById('globalSearch');
  if (searchInput) searchInput.value = '';
  var scopeSelect = document.getElementById('scopeToggle');
  if (scopeSelect) scopeSelect.value = filterScope;
  renderView();
}
function setFilterStatus(val) {
  if (val === 'All') {
    resetTaskFilters();
  } else {
    filterStatus = val;
    renderView();
  }
}

let searchQuery = '';
let filterStatus = 'All';
let filterPriority = 'All';
let filterProject = 'All';
let notifications = [];
let isDataLoaded = false;
const DEFAULT_APP_SETTINGS = {
  showLogsToAdmins: 'true',
  showAttachmentsToAdmins: 'true',
  showTeamToAdmins: 'true',
  showProjectsToAdmins: 'true',
  showSettingsToAdmins: 'true',
  showLogsToManagers: 'false',
  showAttachmentsToManagers: 'false',
  showTeamToManagers: 'false',
  showProjectsToManagers: 'false',
  showSettingsToManagers: 'false',
  allowNewTaskToManagers: 'true',
  showLogsToUsers: 'false',
  showAttachmentsToUsers: 'false',
  showTeamToUsers: 'false',
  showProjectsToUsers: 'false',
  showSettingsToUsers: 'false',
  allowNewTaskToUsers: 'true',
  disableDemoSeed: 'false'
};

function mergeSettings(settings) {
  return Object.assign({}, DEFAULT_APP_SETTINGS, settings || {});
}

let appSettings = mergeSettings();
let calendarMonth = new Date().getMonth();
let calendarYear = new Date().getFullYear();
let calendarMode = 'Month';

function getMonthName(month) {
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][month] || '';
}

function getDaysInMonth(year, month) {
  return new Date(year, month + 1, 0).getDate();
}

function changeCalendarMonth(offset) {
  var date = new Date(calendarYear, calendarMonth + offset, 1);
  calendarYear = date.getFullYear();
  calendarMonth = date.getMonth();
  renderView();
}

function setCalendarMode(mode) {
  calendarMode = mode;
  renderView();
}

function buildMonthTaskMap(year, month) {
  var map = {};
  getFilteredVisibleTasks().forEach(function(task) {
    if (!task.deadline) return;
    var d = new Date(task.deadline);
    if (d.getFullYear() === year && d.getMonth() === month) {
      var day = d.getDate();
      map[day] = map[day] || [];
      map[day].push(task);
    }
  });
  return map;
}

function getCalendarTasks() {
  return getFilteredVisibleTasks().filter(function(task) {
    if (!task.deadline) return false;
    var d = new Date(task.deadline);
    return d.getFullYear() === calendarYear && d.getMonth() === calendarMonth;
  });
}

// ============================================================
// STARTUP — Load data from Google Sheet
// ============================================================
function initApp() {
  google.script.run
    .withSuccessHandler(function(data) {
      USERS = data.users || [];
      tasks = data.tasks || [];
      PROJECTS_LIST = data.projects || [];
      appSettings = mergeSettings(data.settings);

      if (!tasks.length) {
        tasks = getDemoTasks();
        showToast('Loaded demo tasks for Kanban view', 'info');
      }

      // Calculate next task ID
      var maxId = 0;
      tasks.forEach(function(t) {
        var id = parseInt(t.id);
        if (!isNaN(id) && id > maxId) maxId = id;
      });
      nextTaskId = maxId + 1;

      isDataLoaded = true;

      // Hide loading, show login
      document.getElementById('loadingOverlay').style.display = 'none';
      
      // Check for saved session
      var saved = localStorage.getItem('buildtrack_user');
      var remember = localStorage.getItem('buildtrack_remember');
      var rememberExpires = localStorage.getItem('buildtrack_remember_expires');
      if (remember === 'true' && rememberExpires) {
        if (Date.now() > parseInt(rememberExpires)) {
          // Expired
          localStorage.removeItem('buildtrack_user');
          localStorage.removeItem('buildtrack_remember');
          localStorage.removeItem('buildtrack_remember_expires');
          saved = null;
          remember = null;
        }
      }
      if (saved) {
        try {
          var u = JSON.parse(saved);
          var valid = USERS.find(function(x) { return x.username === u.username; });
          if (valid) {
            currentUser = valid;
            // Pre-fill Remember Me status
            if (remember === 'true') {
              setTimeout(function() {
                var chk = document.getElementById('loginRemember');
                if (chk) chk.checked = true;
              }, 50);
            }
            enterApp();
            return;
          }
        } catch(e) {}
      }

      // Pre-fill credentials if saved via "Remember Me"
      var savedUsername = localStorage.getItem('buildtrack_saved_username');
      var savedPassword = localStorage.getItem('buildtrack_saved_password');
      if (savedUsername) {
        document.getElementById('loginUsername').value = savedUsername;
      }
      if (savedPassword) {
        document.getElementById('loginPassword').value = savedPassword;
      }
      if (remember === 'true') {
        setTimeout(function() {
          var chk = document.getElementById('loginRemember');
          if (chk) chk.checked = true;
        }, 50);
      }
      
      document.getElementById('loginPage').classList.remove('hidden');
      updateSearchPlaceholder();
    })
    .withFailureHandler(function(err) {
      document.getElementById('loadingOverlay').innerHTML = 
        '<div class="text-center"><i class="fas fa-exclamation-triangle text-red-500 text-3xl mb-4"></i>' +
        '<p class="text-red-400 mb-2">Connection failed</p>' +
        '<p class="text-xs text-base-500 mb-4">' + (err.message || err) + '</p>' +
        '<button onclick="location.reload()" class="px-4 py-2 bg-amber-500 text-black rounded-lg text-sm">Retry</button></div>';
    })
    .getInitialData();
}

// Refresh data from sheet
let lastSyncTime = Date.now();
function refreshData(isAuto) {
  if (!isAuto) {
    showToast('Refreshing data...', 'info');
  }
  google.script.run
    .withSuccessHandler(function(data) {
      lastSyncTime = Date.now();
      USERS = data.users || [];
      tasks = data.tasks || [];
      PROJECTS_LIST = data.projects || [];
      appSettings = mergeSettings(data.settings);
      if (!tasks.length) {
        tasks = getDemoTasks();
        showToast('Loaded demo tasks for Kanban view', 'info');
      }
      var maxId = 0;
      tasks.forEach(function(t) {
        var id = parseInt(t.id);
        if (!isNaN(id) && id > maxId) maxId = id;
      });
      nextTaskId = maxId + 1;
      checkOverdue();
      updateNotifications();
      renderView();
      if (!isAuto) {
        showToast('Data refreshed from Google Sheet');
      }
    })
    .withFailureHandler(function(err) {
      if (!isAuto) {
        showToast('Failed to refresh: ' + err.message, 'error');
      }
    })
    .getInitialData();
}

// Start the app
initApp();

// --- HELPERS ---
function normalizeRole(role) {
  return String(role || '').trim().toLowerCase().replace(/\s+/g, ' ');
}
function isSuperAdmin() {
  if (!currentUser) return false;
  var role = normalizeRole(currentUser.role);
  return role === 'super admin' || role === 'superadmin' || role === 'super admin user';
}
function isAdmin() {
  if (!currentUser) return false;
  var role = normalizeRole(currentUser.role);
  return role === 'admin' || role === 'md' || isSuperAdmin();
}
function isMD() {
  if (!currentUser) return false;
  var role = normalizeRole(currentUser.role);
  return role === 'md' || isSuperAdmin();
}
function isAdminRole() {
  return currentUser && normalizeRole(currentUser.role) === 'admin';
}
function canAdminManageUsers() {
  return isAdminRole() || isSuperAdmin();
}
function isNamedManagerRole() {
  if (!currentUser) return false;
  var role = normalizeRole(currentUser.role);
  if (role === 'admin' || role === 'md' || isSuperAdmin()) return false;
  return role.indexOf('manager') !== -1;
}
function isRegularUser() {
  return currentUser && !isSuperAdmin() && !isMD() && !isAdminRole() && !isNamedManagerRole();
}
function isManager() {
  if (!currentUser) return false;
  if (isAdmin() || isSuperAdmin()) return true;
  if (currentUser.role && currentUser.role.toLowerCase().indexOf('manager') !== -1) return true;
  var currentLower = currentUser.username.toLowerCase().trim();
  return USERS.some(function(u) { 
    return String(u.manager || '').toLowerCase().trim() === currentLower; 
  });
}
function getMyTeamUsernames() {
  if (!currentUser) return [];
  if (isSuperAdmin() || isAdmin()) {
    return USERS.map(function(u) { return u.username; });
  }
  var currentLower = currentUser.username.toLowerCase().trim();
  var team = USERS.filter(function(u) { 
    return String(u.manager || '').toLowerCase().trim() === currentLower; 
  }).map(function(u) { return u.username; });
  team.push(currentUser.username);
  return team;
}

function getVisibleTasks() {
  if (isSuperAdmin() || isAdmin()) return tasks;
  if (isManager()) {
    var teamUsernames = getMyTeamUsernames();
    return tasks.filter(function(t) { return teamUsernames.indexOf(t.assignee) !== -1; });
  }
  return tasks.filter(function(t) { return String(t.assignee).trim() === String(currentUser.username).trim(); });
}

function getFilteredVisibleTasks() {
  if (!currentUser) return [];
  if (filterScope === 'My') {
    return tasks.filter(function(t) { return String(t.assignee).trim() === String(currentUser.username).trim(); });
  } else if (filterScope === 'Team') {
    if (isSuperAdmin() || isAdmin()) return tasks;
    if (isManager()) {
      var teamUsernames = getMyTeamUsernames();
      return tasks.filter(function(t) { return teamUsernames.indexOf(t.assignee) !== -1; });
    }
    return tasks.filter(function(t) { return String(t.assignee).trim() === String(currentUser.username).trim(); });
  } else if (filterScope === 'All') {
    if (isSuperAdmin() || isAdmin()) {
      return tasks;
    }
    if (isManager()) {
      var teamUsernames = getMyTeamUsernames();
      return tasks.filter(function(t) { return teamUsernames.indexOf(t.assignee) !== -1; });
    }
    return tasks.filter(function(t) { return String(t.assignee).trim() === String(currentUser.username).trim(); });
  }
  return getVisibleTasks();
}

function getActiveFilteredTasks() {
  var query = (searchQuery || '').toLowerCase().trim();
  var filtered = getFilteredVisibleTasks().filter(function(t){
    return (filterStatus==='All'||t.status===filterStatus) &&
           (filterPriority==='All'||t.priority===filterPriority) &&
           (filterProject==='All'||t.project===filterProject) &&
           (!query ||
             (t.title || '').toLowerCase().includes(query) ||
             (t.desc || '').toLowerCase().includes(query) ||
             (t.project || '').toLowerCase().includes(query) ||
             getUserDisplayName(t.assignee).toLowerCase().includes(query)
           );
  });

  if (currentSortColumn) {
    filtered.sort(function(a, b) {
      var valA, valB;
      switch (currentSortColumn) {
        case 'id':
          valA = Number(a.id) || 0;
          valB = Number(b.id) || 0;
          break;
        case 'title':
          valA = (a.title || '').toLowerCase();
          valB = (b.title || '').toLowerCase();
          break;
        case 'desc':
          valA = (a.desc || '').toLowerCase();
          valB = (b.desc || '').toLowerCase();
          break;
        case 'assignee':
          valA = getUserDisplayName(a.assignee).toLowerCase();
          valB = getUserDisplayName(b.assignee).toLowerCase();
          break;
        case 'assignedBy':
          valA = getUserDisplayName(a.assignedBy).toLowerCase();
          valB = getUserDisplayName(b.assignedBy).toLowerCase();
          break;
        case 'priority':
          var pMap = { 'High': 3, 'Medium': 2, 'Low': 1 };
          valA = pMap[a.priority] || 0;
          valB = pMap[b.priority] || 0;
          break;
        case 'status':
          valA = (a.status || '').toLowerCase();
          valB = (b.status || '').toLowerCase();
          break;
        case 'progress':
          valA = Number(a.progress) || 0;
          valB = Number(b.progress) || 0;
          break;
        case 'deadline':
          valA = a.deadline ? new Date(a.deadline).getTime() : 0;
          valB = b.deadline ? new Date(b.deadline).getTime() : 0;
          break;
        case 'created':
          valA = a.created ? new Date(a.created).getTime() : 0;
          valB = b.created ? new Date(b.created).getTime() : 0;
          break;
        case 'comments':
          valA = (a.comments || []).length;
          valB = (b.comments || []).length;
          break;
        default:
          valA = a.id;
          valB = b.id;
      }

      if (valA < valB) return currentSortOrder === 'asc' ? -1 : 1;
      if (valA > valB) return currentSortOrder === 'asc' ? 1 : -1;
      return 0;
    });
  }
  return filtered;
}

  return [
    {id:1,title:'Site survey — Phase 3',desc:'Complete the total station survey and set out benchmarks for Phase 3.',project:'Green Valley Residency',assignee:'priya',priority:'Medium',status:'Pending',progress:0,deadline:'2026-08-10',created:'2026-05-15',comments:[]},
    {id:2,title:'Structural steel inspection — Level 5',desc:'Inspect structural steel connections and ensure compliance with load plans.',project:'Skyline Towers',assignee:'deepa',priority:'High',status:'In Progress',progress:45,deadline:'2026-07-05',created:'2026-05-12',comments:['Safety check complete']},
    {id:3,title:'Lift shaft preparation — Tower B',desc:'Finish lift shaft preparation and verify alignment before installation.',project:'Metro Bridge Overpass',assignee:'suresh',priority:'Medium',status:'Completed',progress:100,deadline:'2026-05-25',created:'2026-05-05',comments:['Installation complete']},
    {id:4,title:'Material procurement — facade panels',desc:'Confirm facade panel quantities and finalize vendor delivery schedule.',project:'Sunrise Mall',assignee:'anil',priority:'Low',status:'Pending',progress:0,deadline:'2026-09-12',created:'2026-05-18',comments:[]},

function getUserPhoto(username) { var u = USERS.find(function(x) { return x.username === username; }); return u ? u.photo : null; }
function userAvatarHtml(username, sizeClass, textSizeClass, extraClasses) {
  var photo = getUserPhoto(username);
  var name = getUserDisplayName(username);
  if (photo) {
    return '<img src="' + photo + '" class="' + sizeClass + ' rounded-full object-cover ' + (extraClasses || '') + '" title="' + name + '">';
  }
  return '<div class="' + sizeClass + ' rounded-full flex items-center justify-center ' + (textSizeClass || 'text-[9px]') + ' font-bold text-base-950 ' + (extraClasses || '') + '" style="background:' + getUserColor(username) + '" title="' + name + '">' + getUserInitials(username) + '</div>';
}
function getUserDisplayName(username) { var u = USERS.find(function(x) { return x.username === username; }); return u ? u.name : (username || '').toString(); }
function getUserInitials(username) {
  if (!username) return 'NA';
  var target = username.toString().trim();
  var u = USERS.find(function(x) { return String(x.username || '').toLowerCase() === target.toLowerCase(); });
  if (u && u.initials) return u.initials;
  var parts = target.split(/[\s_+.-]+/);
  if (parts.length >= 2 && parts[0] && parts[1]) {
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }
  return target.substring(0, 2).toUpperCase();
}
function getUserColor(username) {
  if (!username) return '#78716c';
  var target = username.toString().trim().toLowerCase();
  var u = USERS.find(function(x) { return String(x.username || '').toLowerCase() === target; });
  if (u) return u.color;
  if (target.indexOf('nisha') > -1) return '#10b981';
  if (target === 'system') return '#78716c';
  var hash = 0;
  for (var i = 0; i < target.length; i++) {
    hash = target.charCodeAt(i) + ((hash << 5) - hash);
  }
  var colors = ['#0d9488', '#d97706', '#7c3aed', '#dc2626', '#2563eb', '#059669', '#ec4899', '#0284c7'];
  return colors[Math.abs(hash) % colors.length];
}
function getStatusClass(s) { var m = {'Pending':'badge-pending','In Progress':'badge-progress','Under Review':'badge-review','Completed':'badge-completed','Overdue':'badge-overdue'}; return m[s]||'badge-pending'; }
function getPriorityIcon(p) { if(p==='High') return '<i class="fas fa-arrow-up priority-high"></i>'; if(p==='Medium') return '<i class="fas fa-minus priority-medium"></i>'; return '<i class="fas fa-arrow-down priority-low"></i>'; }
function daysUntil(d) { var a=new Date(d),b=new Date(); a.setHours(0,0,0,0); b.setHours(0,0,0,0); return Math.ceil((a-b)/864e5); }
function formatDate(d) { return new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }

function formatCommentTimestamp(dInput) {
  if (!dInput) return '';
  var d = new Date(dInput);
  if (isNaN(d.getTime())) return String(dInput);
  var day = d.getDate();
  var dayStr = day < 10 ? '0' + day : day;
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var month = months[d.getMonth()];
  var hours = d.getHours();
  var minutes = d.getMinutes();
  var ampm = hours >= 12 ? 'pm' : 'am';
  hours = hours % 12;
  hours = hours ? hours : 12;
  var hrsStr = hours < 10 ? '0' + hours : hours;
  var minStr = minutes < 10 ? '0' + minutes : minutes;
  return dayStr + ' ' + month + ', ' + hrsStr + ':' + minStr + ' ' + ampm;
}
function checkOverdue() { tasks.forEach(function(t) { if(t.status!=='Completed' && t.status!=='Overdue' && daysUntil(t.deadline)<0) t.status='Overdue'; }); }
function showToast(msg, type) {
  type = type || 'success';
  var c=document.getElementById('toastContainer');
  var colors={success:'border-green-500 bg-green-500/10',error:'border-red-500 bg-red-500/10',info:'border-amber-500 bg-amber-500/10'};
  var icons={success:'fa-check-circle text-green-400',error:'fa-exclamation-circle text-red-400',info:'fa-info-circle text-amber-400'};
  var el=document.createElement('div');
  el.className='toast flex items-center gap-2 px-3 py-2 rounded-lg border text-xs ' + colors[type] + ' backdrop-blur-sm shadow-lg';
  el.innerHTML='<i class="fas ' + icons[type] + '"></i><span class="text-sm">' + msg + '</span>';
  c.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3000);
}

// --- NOTIFICATIONS & SEEN TRACKING ---
function addToSeenList(taskId) {
  if (!currentUser) return;
  var seenKey = 'seen_tasks_' + currentUser.username;
  var seenIds = [];
  try {
    seenIds = JSON.parse(localStorage.getItem(seenKey) || '[]');
  } catch(e) {}
  if (seenIds.indexOf(taskId) === -1) {
    seenIds.push(taskId);
    localStorage.setItem(seenKey, JSON.stringify(seenIds));
  }
}

function updateNotifications() {
  var vis = getFilteredVisibleTasks();
  var overdue = vis.filter(function(t){ return t.status==='Overdue'; });
  var highP = vis.filter(function(t){ return t.priority==='High' && t.status!=='Completed'; });
  notifications = [];
  
  // Newly assigned tasks notification logic
  if (currentUser) {
    var seenKey = 'seen_tasks_' + currentUser.username;
    var seenIds = [];
    try {
      seenIds = JSON.parse(localStorage.getItem(seenKey) || '[]');
    } catch(e) {}
    
    var userTasks = tasks.filter(function(t) { return t.assignee === currentUser.username; });
    userTasks.forEach(function(t) {
      if (seenIds.indexOf(t.id) === -1) {
        var assignerName = t.assignedBy ? getUserDisplayName(t.assignedBy) : 'Management';
        notifications.push({
          id: 'new_' + t.id,
          text: 'New task assigned to you by ' + assignerName + ': "' + t.title + '"',
          icon: 'fa-bell-concierge',
          color: 'text-amber-400',
          time: formatDate(t.created),
          taskId: t.id
        });
      }
    });
  }
  
  if(overdue.length) notifications.push({id:1,text:overdue.length+' overdue task'+(overdue.length>1?'s':''),icon:'fa-triangle-exclamation',color:'text-red-400',time:'Now'});
  if(highP.length) notifications.push({id:2,text:highP.length+' high priority pending',icon:'fa-fire',color:'text-amber-400',time:'Now'});
  var pending = vis.filter(function(t){ return t.status==='Pending'; });
  if(pending.length) notifications.push({id:3,text:pending.length+' task'+(pending.length>1?'s':'')+' awaiting action',icon:'fa-clock',color:'text-yellow-400',time:'Now'});
  
  var b=document.getElementById('notifBadge');
  if(notifications.length){b.classList.remove('hidden');b.textContent=notifications.length;} else b.classList.add('hidden');
}

function toggleNotifications(){ 
  var panel = document.getElementById('notifPanel');
  panel.classList.toggle('hidden'); 
  renderNotifications(); 
  
  // When panel is opened, mark new task notifications as seen
  if (!panel.classList.contains('hidden') && currentUser) {
    markNotificationsAsSeen();
  }
}

function markNotificationsAsSeen() {
  var seenKey = 'seen_tasks_' + currentUser.username;
  var seenIds = [];
  try {
    seenIds = JSON.parse(localStorage.getItem(seenKey) || '[]');
  } catch(e) {}
  
  var updated = false;
  notifications.forEach(function(n) {
    if (n.taskId && seenIds.indexOf(n.taskId) === -1) {
      seenIds.push(n.taskId);
      updated = true;
    }
  });
  
  if (updated) {
    localStorage.setItem(seenKey, JSON.stringify(seenIds));
    // Delay badge update slightly so user has a chance to see it before it updates
    setTimeout(function() {
      updateNotifications();
    }, 2000);
  }
}

function renderNotifications(){
  var list=document.getElementById('notifList');
  list.innerHTML=notifications.length ? notifications.map(function(n){
    var clickHtml = n.taskId ? ' onclick="openDetail('+n.taskId+'); toggleNotifications();" style="cursor:pointer;"' : '';
    var hoverClass = n.taskId ? ' hover:bg-amber-500/10' : ' hover:bg-base-800/40';
    return '<div class="flex items-start gap-3 p-3 border-b border-base-800 transition-colors '+hoverClass+'"'+clickHtml+'><i class="fas '+n.icon+' '+n.color+' mt-0.5"></i><div><p class="text-xs font-500">'+n.text+'</p><p class="text-[10px] text-base-500">'+n.time+'</p></div></div>';
  }).join('') : '<p class="p-4 text-xs text-center text-base-500">No notifications</p>';
}

function clearNotifications(){ 
  if (currentUser) {
    var seenKey = 'seen_tasks_' + currentUser.username;
    var seenIds = [];
    try {
      seenIds = JSON.parse(localStorage.getItem(seenKey) || '[]');
    } catch(e) {}
    notifications.forEach(function(n) {
      if (n.taskId && seenIds.indexOf(n.taskId) === -1) {
        seenIds.push(n.taskId);
      }
    });
    localStorage.setItem(seenKey, JSON.stringify(seenIds));
  }
  notifications=[]; 
  var b=document.getElementById('notifBadge');
  b.classList.add('hidden');
  b.textContent='0';
  renderNotifications(); 
}

function taskRow(t){
  var days=daysUntil(t.deadline);
  var dt=t.status==='Completed'?'Completed':days<0?Math.abs(days)+'d overdue':days===0?'Due today':days+'d left';
  var deadlineHtml = '';
  if (t.status === 'Completed') {
    deadlineHtml = '<span class="text-emerald-500 flex items-center gap-1 text-[11px] font-semibold"><i class="fas fa-check-circle text-[10px]"></i> Completed</span>';
  } else if (days < 0) {
    deadlineHtml = '<span class="text-red-400 flex items-center gap-1 text-[11px] font-semibold"><i class="fas fa-triangle-exclamation text-[10px]"></i> ' + dt + '</span>';
  } else if (days === 0) {
    deadlineHtml = '<span class="text-amber-500 flex items-center gap-1 text-[11px] font-semibold"><i class="fas fa-clock text-[10px]"></i> ' + dt + '</span>';
  } else {
    deadlineHtml = '<span class="text-base-500 flex items-center gap-1 text-[11px]"><i class="far fa-calendar-alt text-[10px]"></i> ' + dt + '</span>';
  }

  var priorityPill = '';
  if (t.priority === 'High') {
    priorityPill = '<div class="w-2 h-2 rounded-full bg-red-500 shadow-[0_0_6px_rgba(239,68,68,0.8)]"></div>';
  } else if (t.priority === 'Medium') {
    priorityPill = '<div class="w-2 h-2 rounded-full bg-amber-500 shadow-[0_0_6px_rgba(245,158,11,0.8)]"></div>';
  } else {
    priorityPill = '<div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_6px_rgba(16,185,129,0.8)]"></div>';
  }

  var statusClass = t.status === 'Completed' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' :
                    t.status === 'Overdue' ? 'bg-red-500/10 text-red-400 border-red-500/20' :
                    t.status === 'In Progress' ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' :
                    'bg-amber-500/10 text-amber-400 border-amber-500/20';

  return '<div class="group flex items-center gap-4 p-4 rounded-2xl bg-base-900/50 hover:bg-base-800/80 border border-base-800/50 hover:border-amber-500/20 cursor-pointer transition-all duration-300 hover:shadow-lg hover:-translate-y-0.5" onclick="openDetail('+t.id+')">' +
           '<div class="flex items-center justify-center shrink-0 w-8 h-8 rounded-full bg-base-950 border border-base-800 shadow-inner">' + priorityPill + '</div>' +
           '<div class="flex-1 min-w-0">' +
             '<p class="text-sm font-semibold text-base-100 truncate group-hover:text-amber-50 transition-colors">' + t.title + '</p>' +
             '<div class="flex items-center gap-3 mt-1.5">' +
               '<span class="text-[10px] font-bold tracking-wider propercase text-base-500">' + t.project + '</span>' +
               '<span class="w-1 h-1 rounded-full bg-base-700"></span>' +
               deadlineHtml +
             '</div>' +
           '</div>' +
           '<div class="flex items-center gap-3 shrink-0">' +
             '<span class="hidden sm:inline-flex px-2.5 py-1 text-[9px] font-bold uppercase tracking-widest rounded-full border ' + statusClass + '">' + t.status + '</span>' +

function renderTasksView(){
  var filtered = getActiveFilteredTasks();

  var teamUsernames = getMyTeamUsernames();

  var tableRows = filtered.map(function(t) {
    var days=daysUntil(t.deadline);

    var deadlineHtml = '';
    if (t.status === 'Completed') {
      deadlineHtml = '<span class="text-emerald-500 flex items-center gap-1 text-[11px] font-medium"><i class="fas fa-check-circle text-[10px]"></i> Completed</span>';
    } else if (days < 0) {
      deadlineHtml = '<span class="text-red-400 font-semibold flex items-center gap-1 text-[11px]"><i class="fas fa-triangle-exclamation text-[10px]"></i> ' + dt + '</span>';
    } else if (days === 0) {
      deadlineHtml = '<span class="text-amber-500 font-semibold flex items-center gap-1 text-[11px]"><i class="fas fa-clock text-[10px]"></i> ' + dt + '</span>';
    } else {
      deadlineHtml = '<span class="text-base-500 flex items-center gap-1 text-[11px]"><i class="far fa-calendar text-[10px]"></i> ' + dt + '</span>';
    }

    var priorityPill = '';
    if (t.priority === 'High') {
      priorityPill = '<span class="px-2 py-0.5 rounded text-[10px] font-bold propercase tracking-wider priority-high inline-flex items-center gap-1"><i class="fas fa-arrow-up text-[9px]"></i> High</span>';
    } else if (t.priority === 'Medium') {
      priorityPill = '<span class="px-2 py-0.5 rounded text-[10px] font-bold propercase tracking-wider priority-medium inline-flex items-center gap-1"><i class="fas fa-minus text-[9px]"></i> Med</span>';
    } else {
      priorityPill = '<span class="px-2 py-0.5 rounded text-[10px] font-bold propercase tracking-wider priority-low inline-flex items-center gap-1"><i class="fas fa-arrow-down text-[9px]"></i> Low</span>';
    }

    var uName = getUserDisplayName(t.assignee);

    var assignedByHtml = t.assignedBy ? 
      '<div class="flex items-center gap-2">' +
        userAvatarHtml(t.assignedBy, 'w-6 h-6', 'text-[9px]', 'shrink-0') +
        '<span class="text-xs text-base-300 font-medium">' + getUserDisplayName(t.assignedBy) + '</span>' +

    var progressHtml = '<div class="flex items-center gap-2 min-w-[80px]">' +

    var commentsCount = (t.comments || []).length;

      '<i class="far fa-comments text-amber-500/80"></i> ' +
      '<span>' + commentsCount + '</span>' +
    '</div>';

    var canEdit = isMD() || isSuperAdmin() || isManager() || t.assignee === currentUser.username;
    var canDelete = isMD();
    var canAssign = isMD() || isManager();

    // Inline Quick-Edit for Priority in Table View
    var priorityCellHtml = '';
    if (canEdit && !isTaskCompleted(t)) {
      priorityCellHtml = '<div class="relative inline-block group" onclick="event.stopPropagation()">' +
        '<span class="cursor-pointer hover:ring-2 hover:ring-amber-500/40 rounded transition-all">' + priorityPill + '</span>' +
        '<select onchange="quickUpdatePriority(' + t.id + ', this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer select-clean" title="Click to quick-change priority">' +
          '<option value="High"' + (t.priority === 'High' ? ' selected' : '') + '>High</option>' +
          '<option value="Medium"' + (t.priority === 'Medium' ? ' selected' : '') + '>Medium</option>' +
          '<option value="Low"' + (t.priority === 'Low' ? ' selected' : '') + '>Low</option>' +
        '</select>' +
      '</div>';
    } else {
      priorityCellHtml = priorityPill;
    }

    // Inline Quick-Edit for Status in Table View

      t.status + (canEdit ? ' <i class="fas fa-chevron-down text-[8px] opacity-60 group-hover:opacity-100 transition-opacity"></i>' : '') + 
    '</span>';
    if (canEdit) {

        statusBadge +
        '<select onchange="quickUpdateStatus(' + t.id + ', this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer select-clean" title="Click to quick-change status">' +
          '<option value="Pending"' + (t.status === 'Pending' ? ' selected' : '') + '>Pending</option>' +

      }

    // 3. Assign Dropdown

      } else {
        var taskTeamMembers = USERS.filter(function(u) { return teamUsernames.indexOf(u.username) !== -1; });

            taskTeamMembers.unshift(currentAssigneeObj);
          }
        }
        var selectOptions = taskTeamMembers.map(function(u) {
          return '<option value="' + u.username + '" ' + (u.username === t.assignee ? 'selected' : '') + '>' + u.name + '</option>';
        }).join('');
        
        actionButtonsHtml += '<div class="relative w-8 h-8 rounded-xl bg-base-850 hover:bg-base-800 border border-base-800 flex items-center justify-center text-base-400 hover:text-base-200 hover:border-amber-500/20 transition-all" title="Assign Task">' +
          '<i class="fas fa-user-plus text-[10px]"></i>' +
          '<select onchange="event.stopPropagation(); quickAssignTask(' + t.id + ', this.value)" onclick="event.stopPropagation()" class="absolute inset-0 w-full h-full cursor-pointer select-clean" style="opacity: 0 !important;">' +
            selectOptions +
          '</select>' +
        '</div>';
      }
    }

    // 4. Delete button
    if (canDelete) {
      actionButtonsHtml += '<button onclick="event.stopPropagation(); deleteTask(' + t.id + ')" class="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-red-500/5 hover:bg-red-500/10 border border-red-500/10 hover:border-red-500/20 text-red-400 transition-all" title="Delete Task"><i class="fas fa-trash-can text-[11px]"></i></button>';
    }
    
    actionButtonsHtml += '</div>';

    return '<tr class="border-b border-base-800/40 hover:bg-base-900/40 transition-colors cursor-pointer" onclick="openDetail(' + t.id + ')">' +
      '<td class="px-3 py-3 whitespace-nowrap text-xs font-mono text-base-400">#' + t.id + '</td>' +
      '<td class="px-3 py-3">' +
        '<div class="flex flex-col gap-1">' +
          '<span class="text-xs font-bold text-base-200 hover:text-amber-500 transition-colors">' + t.title + '</span>' +
          '<span class="text-[10px] text-base-500 font-medium">' + t.project + '</span>' +
        '</div>' +
      '</td>' +
      '<td class="px-3 py-3 max-w-[200px] truncate text-xs text-base-400" title="' + (t.desc || '') + '">' + (t.desc || '—') + '</td>' +
      '<td class="px-3 py-3 whitespace-nowrap">' +
        '<div class="flex items-center gap-2">' +
          userAvatarHtml(t.assignee, 'w-6 h-6', 'text-[9px]', 'shrink-0') +
          '<span class="text-xs text-base-300 font-medium">' + uName + '</span>' +
        '</div>' +
      '</td>' +
      '<td class="px-3 py-3 whitespace-nowrap">' + assignedByHtml + '</td>' +
      '<td class="px-3 py-3 whitespace-nowrap">' + priorityCellHtml + '</td>' +
      '<td class="px-3 py-3 whitespace-nowrap">' + statusCellHtml + '</td>' +
      '<td class="px-3 py-3 whitespace-nowrap">' + progressHtml + '</td>' +
      '<td class="px-3 py-3 whitespace-nowrap">' +
        '<div class="flex flex-col gap-1">' +
          '<span class="text-xs font-semibold text-base-300">' + formatDate(t.deadline) + '</span>' +
          '<span>' + deadlineHtml + '</span>' +
        '</div>' +
      '</td>' +
      '<td class="px-3 py-3 whitespace-nowrap text-xs text-base-300 font-medium">' + (t.created ? formatDate(t.created) : '—') + '</td>' +
      '<td class="px-3 py-3 whitespace-nowrap">' + commentsBadgeHtml + '</td>' +
      '<td class="px-3 py-3 whitespace-nowrap text-center" onclick="event.stopPropagation()">' + actionButtonsHtml + '</td>' +
    '</tr>';
  }).join('');

  var tableHtml = 
    '<div class="bg-base-900 border border-base-800 rounded-2xl overflow-hidden shadow-xl fade-up">' +
      '<div class="overflow-x-auto overflow-y-auto max-h-[calc(100vh-220px)] relative">' +
        '<table class="min-w-[1400px] w-full border-collapse text-left">' +
          '<thead class="sticky-thead">' +
            '<tr class="border-b border-base-800 bg-base-900/60 text-[10px] text-base-400 font-700 propercase tracking-wider">' +
              renderSortHeader('id', 'ID') +
              renderSortHeader('title', 'Title & Project') +
              renderSortHeader('desc', 'Description') +
              renderSortHeader('assignee', 'Assignee') +
              renderSortHeader('assignedBy', 'Assigned By') +
              renderSortHeader('priority', 'Priority') +
              renderSortHeader('status', 'Status') +
              renderSortHeader('progress', 'Progress') +
              renderSortHeader('deadline', 'Deadline') +
              renderSortHeader('created', 'Created') +
              renderSortHeader('comments', 'Comments') +
              '<th class="px-3 py-3 text-center text-base-400">Actions</th>' +
            '</tr>' +
          '</thead>' +
          '<tbody class="divide-y divide-base-800/40 bg-base-900/20">' + 
            (filtered.length ? tableRows : '<tr><td colspan="12" class="text-center text-base-500 py-12">No tasks match</td></tr>') + 
          '</tbody>' +
        '</table>' +
      '</div>' +
    '</div>';

  var resetButton = (filterStatus!=='All' || filterPriority!=='All' || filterProject!=='All' || searchQuery || filterScope!=='Team') ? '<button onclick="resetTaskFilters()" class="px-3 py-1.5 rounded-lg text-xs bg-base-800 border border-base-700 text-base-400 hover:bg-base-900 transition-colors">Reset</button>' : '';
  var tasksViewTitle = (isMD() || isManager()) ? 'All Tasks' : 'My Tasks';
  var canCreateTask = isMD() || isSuperAdmin() || isAdmin() || (isNamedManagerRole() && appSettings.allowNewTaskToManagers === 'true') || (isRegularUser() && appSettings.allowNewTaskToUsers === 'true');
  var newTaskBtnHtml = canCreateTask ? '<button onclick="openTaskModal()" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-sky-500 hover:bg-sky-400 text-base-950 font-600 text-sm transition-colors shadow-lg shadow-sky-500/20"><i class="fas fa-plus text-xs"></i> New Task</button>' : '';
  return '<div class="flex justify-between items-center mb-4">' +
           '<h2 class="text-xl font-display font-bold text-base-100">' + tasksViewTitle + '</h2>' +
           newTaskBtnHtml +
         '</div>' +
         '<div class="flex gap-3 mb-4 flex-wrap items-center">' +
           '<select onchange="setFilterStatus(this.value)" class="px-3 py-1.5 rounded-lg text-xs"><option value="All">All Status</option><option value="Pending">Pending</option><option value="In Progress">In Progress</option><option value="Under Review">Under Review</option><option value="Completed">Completed</option><option value="Overdue">Overdue</option></select>' +
           '<select onchange="filterPriority=this.value;renderView()" class="px-3 py-1.5 rounded-lg text-xs"><option value="All">All Priority</option><option value="High">High</option><option value="Medium">Medium</option><option value="Low">Low</option></select>' +
           '<select onchange="filterProject=this.value;renderView()" class="px-3 py-1.5 rounded-lg text-xs"><option value="All">All Projects</option>' + PROJECTS_LIST.map(function(p){return '<option value="'+p.name+'">'+p.name+'</option>';}).join('') + '</select>' +
           resetButton +

         (canCreateTask ? '<button onclick="openTaskModal()" class="fixed bottom-6 right-6 sm:hidden z-50 w-14 h-14 rounded-full bg-sky-500 hover:bg-sky-400 text-base-950 shadow-2xl shadow-sky-500/30 flex items-center justify-center transition-all active:scale-90"><i class="fas fa-plus text-xl"></i></button>' : '');
}

function renderCalendarView(){
  var taskMap = buildMonthTaskMap(calendarYear, calendarMonth);
  var daysInMonth = getDaysInMonth(calendarYear, calendarMonth);
  var startWeekday = new Date(calendarYear, calendarMonth, 1).getDay();
  var monthTasks = getCalendarTasks();
  var today = new Date();

  var html = '<div class="space-y-3">';

  // ── Header ──────────────────────────────────────────────────
  html += '<div style="background:var(--card);border:1px solid var(--border-strong);border-radius:16px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;">' +
    '<div style="display:flex;align-items:center;gap:14px;">' +
      '<div style="background:var(--accent-subtle);border:1px solid var(--accent-glow);border-radius:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;">' +
        '<i class="fas fa-calendar-alt" style="color:var(--accent);font-size:16px;"></i>' +
      '</div>' +
      '<div>' +
        '<p style="font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--fg-subtle);margin:0 0 1px;">Schedule</p>' +
        '<h3 style="font-size:18px;font-weight:700;color:var(--fg);margin:0;letter-spacing:-.01em;">' + getMonthName(calendarMonth) + ' <span style="font-weight:400;color:var(--fg-muted);">' + calendarYear + '</span></h3>' +
      '</div>' +
    '</div>' +
    '<div style="display:flex;align-items:center;gap:6px;">' +
      '<button onclick="setCalendarMode(\'Month\')" style="padding:6px 14px;border-radius:10px;font-size:11px;font-weight:600;border:1px solid ' + (calendarMode==='Month' ? 'var(--accent)' : 'var(--border-strong)') + ';background:' + (calendarMode==='Month' ? 'var(--accent)' : 'var(--card-alt)') + ';color:' + (calendarMode==='Month' ? '#060e17' : 'var(--fg-muted)') + ';cursor:pointer;transition:all .2s;">Month</button>' +
      '<button onclick="setCalendarMode(\'Timeline\')" style="padding:6px 14px;border-radius:10px;font-size:11px;font-weight:600;border:1px solid ' + (calendarMode==='Timeline' ? 'var(--accent)' : 'var(--border-strong)') + ';background:' + (calendarMode==='Timeline' ? 'var(--accent)' : 'var(--card-alt)') + ';color:' + (calendarMode==='Timeline' ? '#060e17' : 'var(--fg-muted)') + ';cursor:pointer;transition:all .2s;">Timeline</button>' +
      '<div style="width:1px;height:22px;background:var(--border-strong);margin:0 4px;"></div>' +
      '<button onclick="changeCalendarMonth(-1)" style="width:34px;height:34px;border-radius:10px;border:1px solid var(--border-strong);background:var(--card-alt);color:var(--fg-muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s;" onmouseover="this.style.background=\'var(--accent-subtle)\';this.style.color=\'var(--accent)\';this.style.borderColor=\'var(--accent-glow)\'" onmouseout="this.style.background=\'var(--card-alt)\';this.style.color=\'var(--fg-muted)\';this.style.borderColor=\'var(--border-strong)\'">‹</button>' +
      '<button onclick="changeCalendarMonth(1)"  style="width:34px;height:34px;border-radius:10px;border:1px solid var(--border-strong);background:var(--card-alt);color:var(--fg-muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s;" onmouseover="this.style.background=\'var(--accent-subtle)\';this.style.color=\'var(--accent)\';this.style.borderColor=\'var(--accent-glow)\'" onmouseout="this.style.background=\'var(--card-alt)\';this.style.color=\'var(--fg-muted)\';this.style.borderColor=\'var(--border-strong)\'">›</button>' +
    '</div>' +
  '</div>';

  if (calendarMode === 'Month') {
    // ── Month grid ───────────────────────────────────────────
    html += '<div style="background:var(--card);border:1px solid var(--border-strong);border-radius:16px;padding:16px 18px;overflow:hidden;">';

    // Day-of-week headers
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px;">';
    days.forEach(function(d,i){
      var isW = i === 0 || i === 6;
      html += '<div style="text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:' + (isW ? 'var(--fg-subtle)' : 'var(--fg)') + ';opacity:' + (isW ? '.5' : '.7') + ';padding:5px 0;">' + d + '</div>';
    });
    html += '</div>';

    // Day cells
    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;">';

    for(var b = 0; b < startWeekday; b++){
      html += '<div style="border-radius:12px;background:var(--bg-alt);opacity:.3;"></div>';
    }

    for(var day = 1; day <= daysInMonth; day++){
      var cellTasks = taskMap[day] || [];
      var isToday = today.getFullYear()===calendarYear && today.getMonth()===calendarMonth && today.getDate()===day;
      var isWeekend = (new Date(calendarYear,calendarMonth,day).getDay()%6===0);

      var cellBg = isToday ? 'linear-gradient(135deg, var(--accent-subtle), var(--card))' : (isWeekend ? 'var(--bg-alt)' : 'var(--card-alt)');
      var cellBrd = isToday ? 'var(--accent)' : 'var(--border)';
      var numColor = isToday ? 'var(--accent)' : (isWeekend ? 'var(--fg-subtle)' : 'var(--fg)');

      html += '<div style="min-height:82px;border-radius:12px;border:1px solid ' + cellBrd + ';background:' + cellBg + ';padding:8px 9px;display:flex;flex-direction:column;' + (cellTasks.length === 0 ? 'align-items:center;justify-content:center;' : '') + 'cursor:default;transition:all .18s;position:relative;overflow:hidden;" ' +
              'onmouseover="this.style.borderColor=\'var(--accent-glow)\';this.style.boxShadow=\'0 0 0 1px var(--accent-glow)\';' + (isToday ? '' : 'this.style.borderColor=\'var(--accent-glow)\'') + '" onmouseout="this.style.borderColor=\'' + cellBrd + '\';this.style.boxShadow=\'none\'">' +
        (isToday ? '<div style="position:absolute;top:0;right:0;width:36px;height:36px;border-radius:0 12px 0 24px;background:var(--accent);opacity:.12;"></div>' : '') +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:4px;' + (cellTasks.length === 0 ? 'margin:0;' : 'margin-bottom:6px;') + '">' +
          '<span style="font-size:13px;font-weight:' + (isToday ? '800' : '600') + ';color:' + numColor + ';line-height:1;">' + day + '</span>' +
          (isToday ? '<span style="font-size:7px;background:var(--accent);color:#060e17;border-radius:5px;padding:2px 6px;font-weight:700;line-height:1.4;letter-spacing:.04em;">TODAY</span>' : '') +
        '</div>';

      // Task pills
      if (cellTasks.length > 0) {
        html += '<div style="flex:1;overflow:hidden;display:flex;flex-direction:column;gap:3px;">';
        var dotColors = {'High':'#f87171','Medium':'#fbbf24','Low':'#34d399','Completed':'#34d399','Overdue':'#f87171'};
        var cellLimit = cellTasks.length > 2 ? 1 : 2;
        cellTasks.slice(0, cellLimit).forEach(function(t){
          var dot = dotColors[t.priority] || '#8aa5c0';
          var statusBg = t.status === 'Overdue' ? 'rgba(248,113,113,0.1)' : 'var(--bg-alt)';
          var statusDot = t.status === 'Overdue' ? '#f87171' : dot;
          html += '<div onclick="openDetail(' + t.id + ')" style="display:flex;align-items:center;gap:5px;cursor:pointer;padding:3px 5px;border-radius:6px;background:' + statusBg + ';transition:all .15s;" onmouseover="this.style.background=\'var(--accent-subtle)\'" onmouseout="this.style.background=\'' + statusBg + '\'">' +
            '<div style="width:5px;height:5px;border-radius:50%;background:' + statusDot + ';flex-shrink:0;' + (t.status === 'Overdue' ? 'animation:blink 1.2s infinite;' : '') + '"></div>' +
            '<span style="font-size:9px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;font-weight:500;">' + t.title + '</span>' +
          '</div>';
        });
        if (cellTasks.length > 2) {
          html += '<div style="display:flex;align-items:center;gap:5px;padding:1px 5px;">' +
            '<span style="font-size:8px;color:var(--accent);font-weight:700;">+' + (cellTasks.length-1) + ' more</span>' +
          '</div>';
        }
        html += '</div>';
      }

      html += '</div>';
    }
    html += '</div></div>'; // close grid + card

  } else {
    // ── Timeline ─────────────────────────────────────────────
    html += '<div style="background:var(--card);border:1px solid var(--border-strong);border-radius:16px;padding:16px 18px;">';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">' +
      '<p style="font-size:11px;color:var(--fg-subtle);text-transform:uppercase;letter-spacing:.1em;margin:0;font-weight:600;">Deadline Positions</p>' +
      '<span style="font-size:10px;color:var(--fg-muted);">' + getMonthName(calendarMonth) + ' ' + calendarYear + '</span>' +
    '</div>';

    // Day ruler
    html += '<div style="display:flex;align-items:center;margin-bottom:14px;padding-left:158px;position:relative;">';
    html += '<div style="position:absolute;left:158px;right:0;bottom:-4px;height:1px;background:var(--border);"></div>';
    var rulerStep = Math.max(1, Math.floor(daysInMonth / 7));
    for(var rd = 1; rd <= daysInMonth; rd += rulerStep){
      var isRulerToday = today.getFullYear()===calendarYear && today.getMonth()===calendarMonth && today.getDate()===rd;
      html += '<div style="flex:1;text-align:left;position:relative;">' +
        '<span style="font-size:9px;font-weight:' + (isRulerToday ? '700' : '500') + ';color:' + (isRulerToday ? 'var(--accent)' : 'var(--fg-subtle)') + ';">' + rd + '</span>' +
        (isRulerToday ? '<div style="position:absolute;bottom:-17px;left:0;width:100%;height:2px;background:var(--accent);border-radius:2px;opacity:.7;"></div>' : '') +
      '</div>';
    }
    html += '</div>';

    if (monthTasks.length === 0) {
      html += '<div style="text-align:center;padding:32px 0;">' +
        '<div style="width:48px;height:48px;border-radius:50%;background:var(--bg-alt);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;"><i class="fas fa-calendar-check" style="color:var(--fg-subtle);font-size:16px;"></i></div>' +
        '<p style="font-size:13px;color:var(--fg-subtle);margin:0;font-weight:500;">No tasks with deadlines this month</p>' +
        '<p style="font-size:11px;color:var(--fg-muted);margin:4px 0 0;">Tasks will appear here once they have a deadline set.</p>' +
      '</div>';
    } else {
      var pBars = {
        'High':      {bg:'rgba(248,113,113,0.15)', bar:'#f87171'},
        'Medium':    {bg:'rgba(251,191,36,0.12)',  bar:'#fbbf24'},
        'Low':       {bg:'rgba(52,211,153,0.12)',  bar:'#34d399'},
      };
      var sBadge = {
        'Completed':  {bg:'rgba(52,211,153,0.12)',  fg:'#34d399'},
        'In Progress':{bg:'rgba(96,165,250,0.12)',  fg:'#60a5fa'},
        'Pending':    {bg:'rgba(138,165,192,0.1)',  fg:'#8aa5c0'},
        'Overdue':    {bg:'rgba(248,113,113,0.12)', fg:'#f87171'},
      };

      monthTasks.forEach(function(task, idx){
        var dd = new Date(task.deadline);
        var dayIdx = dd.getDate() - 1;
        var pct = (dayIdx / daysInMonth) * 100;
        var barW = Math.max(100/daysInMonth * 1.8, 3);
        var pc = pBars[task.priority] || pBars['Medium'];
        var sc = sBadge[task.status]  || sBadge['Pending'];
        var uName = getUserDisplayName(task.assignee);

        html += '<div style="display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;margin-bottom:5px;background:var(--card-alt);border:1px solid var(--border);transition:all .18s;cursor:pointer;" onclick="openDetail(' + task.id + ')" onmouseover="this.style.borderColor=\'var(--accent-glow)\';this.style.background=\'var(--bg)\'" onmouseout="this.style.borderColor=\'var(--border)\';this.style.background=\'var(--card-alt)\'">' +
          '<div style="width:150px;flex-shrink:0;">' +
            '<p style="font-size:12px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;line-height:1.3;">' + task.title + '</p>' +
            '<p style="font-size:9px;color:var(--fg-subtle);margin:2px 0 0;"><i class="fas fa-user" style="font-size:7px;margin-right:3px;opacity:.6;"></i>' + uName + ' · ' + formatDate(task.deadline) + '</p>' +
          '</div>' +
          '<div style="flex:1;height:6px;border-radius:6px;background:var(--bg-alt);position:relative;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.1);">' +
            '<div style="position:absolute;left:' + pct + '%;top:0;height:100%;width:' + barW + '%;background:linear-gradient(135deg,' + pc.bar + ',' + pc.bar + 'cc);border-radius:6px;box-shadow:0 0 8px ' + pc.bar + '50;"></div>' +
            '<div style="position:absolute;left:' + pct + '%;top:0;height:100%;width:2px;background:' + pc.bar + ';border-radius:2px;box-shadow:0 0 8px ' + pc.bar + ';"></div>' +
          '</div>' +
          '<span style="font-size:9px;padding:2px 8px;border-radius:20px;font-weight:600;background:' + sc.bg + ';color:' + sc.fg + ';white-space:nowrap;">' + task.status + '</span>' +
          '<div style="width:5px;height:5px;border-radius:50%;background:' + pc.bar + ';flex-shrink:0;opacity:.7;"></div>' +
        '</div>';
      });
    }
    html += '</div>';
  }

  html += '</div>';
  return html;
}

// --- TASK CRUD & DETAILS ---
function findTaskById(taskId) {
  if (taskId === undefined || taskId === null || taskId === '') return null;
  var targetId = String(taskId).trim();
  return tasks.find(function(x) { return String(x.id).trim() === targetId; });
}

function openTaskModal(taskId){
  taskId = taskId || null;
  var teamUsernames = getMyTeamUsernames();

  if (taskId) {
    var t = findTaskById(taskId);
    if (!t) return;
    var canEdit = isMD() || isSuperAdmin() || isManager() || t.assignee === currentUser.username;
    if (!canEdit) {
      showToast('Unauthorized to edit this task', 'error');
      return;
    }

    if (isTaskCompleted(t)) {
      showToast('Completed tasks cannot be edited', 'error');
      return;
    }

    if (taskHasAttachments(taskId)) {
      showToast('Task already has attachments and cannot be edited', 'error');
      return;
    }

    if (taskAttachmentsCache[taskId] === undefined) {
      google.script.run
        .withSuccessHandler(function(attachments) {
          taskAttachmentsCache[taskId] = attachments || [];
          if (taskHasAttachments(taskId)) {
            showToast('Task already has attachments and cannot be edited', 'error');
            return;
          }
          openTaskModalInternal(taskId);
        })
        .withFailureHandler(function(err) {
          showToast('Unable to verify task attachments: ' + err.message, 'error');
        })
        .getTaskAttachments(taskId);
      return;
    }
  }

  openTaskModalInternal(taskId);
}

function openTaskModalInternal(taskId) {
  var modal=document.getElementById('taskModal');
  var teamUsernames = getMyTeamUsernames();
  document.getElementById('taskForm').reset();
  document.getElementById('taskProgress').value=0;

  // Disable fields for employees (non-managers/non-MDs) when EDITING tasks
  var isMgmt = isMD() || isManager();
  var isEditing = !!taskId;
  document.getElementById('taskTitle').disabled = isEditing && !isMgmt;
  document.getElementById('taskDesc').disabled = isEditing && !isMgmt;
  document.getElementById('taskProject').disabled = isEditing && !isMgmt;
  document.getElementById('taskAssignee').disabled = isEditing && !isMgmt;
  document.getElementById('taskPriority').disabled = isEditing && !isMgmt;
  document.getElementById('taskDeadline').disabled = isEditing && !isMgmt;
  document.getElementById('taskStatus').disabled = false;
  document.getElementById('taskProgress').disabled = false;

  // Re-populate project dropdown (in case data refreshed)
  var projectSelect = document.getElementById('taskProject');
  projectSelect.innerHTML = '<option value="">Select project</option>';
  PROJECTS_LIST.forEach(function(p) { projectSelect.innerHTML += '<option value="' + p.name + '">' + p.name + '</option>'; });

  // Re-populate assignee dropdown dynamically based on ALL users from the user's sheet tab
  var assigneeSelect = document.getElementById('taskAssignee');
  assigneeSelect.innerHTML = '<option value="">Select person</option>';
  USERS.forEach(function(u) {
    assigneeSelect.innerHTML += '<option value="' + u.username + '">' + u.name + ' (' + u.username + ')</option>';
  });

  if(taskId){
    var t = findTaskById(taskId);
    if(t){
      document.getElementById('modalTitle').textContent='Edit Task';
      document.getElementById('submitBtnText').textContent='Save Changes';
      document.getElementById('taskId').value=t.id;
      document.getElementById('taskTitle').value=t.title;
      document.getElementById('taskDesc').value=t.desc||'';
      document.getElementById('taskProject').value=t.project;
      document.getElementById('taskAssignee').value=t.assignee;
      var user = USERS.find(function(u) { return u.username === t.assignee; });
      document.getElementById('taskEmail').value = user ? (user.email || '') : '';
      if (user && user.manager) {
        var mgr = USERS.find(function(u) { return u.username === user.manager || u.name === user.manager; });
        document.getElementById('taskAssignedBy').value = mgr ? mgr.name : user.manager;
      } else {
        document.getElementById('taskAssignedBy').value = getUserDisplayName(t.assignedBy) || '';
      }
      document.getElementById('taskPriority').value=t.priority;
      document.getElementById('taskDeadline').value=t.deadline;
      document.getElementById('taskStatus').value=t.status==='Overdue'?'Pending':t.status;
      document.getElementById('taskProgress').value=t.progress;
    }
  } else {
    document.getElementById('modalTitle').textContent='Create New Task';
    document.getElementById('submitBtnText').textContent='Create Task';
    document.getElementById('taskId').value='';
    document.getElementById('taskEmail').value='';
    document.getElementById('taskAssignedBy').value='';
    var d=new Date(); d.setDate(d.getDate()+7);
    document.getElementById('taskDeadline').value=d.toISOString().split('T')[0];
    if(!isMD()) document.getElementById('taskAssignee').value=currentUser.username;
    updateTaskAssigneeEmail();
  }
  modal.classList.remove('hidden'); modal.classList.add('flex');
}
function closeTaskModal(){ var m=document.getElementById('taskModal'); m.classList.add('hidden'); m.classList.remove('flex'); }

function updateTaskAssigneeEmail() {
  var assignee = document.getElementById('taskAssignee').value;
  var emailField = document.getElementById('taskEmail');
  var assignedByField = document.getElementById('taskAssignedBy');
  if (assignee) {
    var user = USERS.find(function(u) { return u.username === assignee; });
    emailField.value = user ? (user.email || '') : '';
    if (user && user.manager) {
      var mgr = USERS.find(function(u) { return u.username === user.manager || u.name === user.manager; });
      assignedByField.value = mgr ? mgr.name : user.manager;
    } else {
      assignedByField.value = currentUser ? currentUser.name : '';
    }
  } else {
    emailField.value = '';
    assignedByField.value = '';
  }
}

function handleTaskSubmit(e){
  e.preventDefault();
  var id=document.getElementById('taskId').value;
  if (id && taskHasAttachments(parseInt(id))) {
    showToast('Task has uploaded attachments and cannot be edited', 'error');
    return;
  }
  var data={
    title:document.getElementById('taskTitle').value.trim(),
    desc:document.getElementById('taskDesc').value.trim(),
    project:document.getElementById('taskProject').value,
    assignee:document.getElementById('taskAssignee').value,
    email:document.getElementById('taskEmail').value,
    priority:document.getElementById('taskPriority').value,
    deadline:document.getElementById('taskDeadline').value,
    status:document.getElementById('taskStatus').value,
    progress:parseInt(document.getElementById('taskProgress').value)||0
  };
  if(data.status!=='Completed' && daysUntil(data.deadline)<0) data.status='Overdue';
  if(data.status==='Completed') data.progress=100;

  // Disable submit button
  var submitBtn = document.getElementById('taskSubmitBtn');
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Saving...';

  var selfAssign = currentUser && data.assignee === currentUser.username;
  var assigneeUser = USERS.find(function(u) { return u.username === data.assignee; });
  var assignedByVal = selfAssign ? currentUser.username : (currentUser ? currentUser.username : '');
  if (!selfAssign && assigneeUser && assigneeUser.manager) {
    var mgr = USERS.find(function(u) { return u.username === assigneeUser.manager || u.name === assigneeUser.manager; });
    assignedByVal = mgr ? mgr.username : assigneeUser.manager;
  }
  var mgrUser = USERS.find(function(u) { return u.username === assignedByVal || u.name === assignedByVal; });
  var assignedByRoleVal = mgrUser ? mgrUser.role : (currentUser ? currentUser.role : '');

  if(id){
    // UPDATE existing task
    var idx=tasks.findIndex(function(t){return t.id===parseInt(id);});
    var existingComments = (idx !== -1) ? (tasks[idx].comments || []) : [];
    var taskObj = {
      id: parseInt(id),
      ...data,
      created: tasks[idx].created,
      comments: existingComments,
      assignedBy: assignedByVal,
      assignedByRole: assignedByRoleVal
    };
    
    google.script.run
      .withSuccessHandler(function(){
        if (taskObj.assignee === currentUser.username) {
          addToSeenList(taskObj.id);
        }
        tasks[idx] = taskObj;
        google.script.run.logSessionAction(currentUser.username, 'Update Task', 'Updated task ID: ' + taskObj.id);
        showToast('Task updated & saved to Sheet');
        closeTaskModal();
        checkOverdue(); updateNotifications(); renderView();
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-check mr-1"></i> <span id="submitBtnText">Save Changes</span>';
      })
      .withFailureHandler(function(err){
        showToast('Save failed: ' + err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-check mr-1"></i> <span id="submitBtnText">Save Changes</span>';
      })
      .saveTaskToSheet(taskObj);
  } else {
    // CREATE new task
    var newId = nextTaskId++;
    var taskObj = {
      id: newId,
      ...data,
      created: new Date().toISOString().split('T')[0],
      comments: [],
      assignedBy: assignedByVal,
      assignedByRole: assignedByRoleVal
    };
    
    google.script.run
      .withSuccessHandler(function(){
        if (taskObj.assignee === currentUser.username) {
          addToSeenList(taskObj.id);
        }
        tasks.push(taskObj);
        google.script.run.logSessionAction(currentUser.username, 'Create Task', 'Created task ID: ' + taskObj.id);
        showToast('Task created & saved to Sheet');
        closeTaskModal();
        checkOverdue(); updateNotifications(); renderView();
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-check mr-1"></i> <span id="submitBtnText">Create Task</span>';
      })
      .withFailureHandler(function(err){
        nextTaskId--;  // Rollback ID
        showToast('Save failed: ' + err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-check mr-1"></i> <span id="submitBtnText">Create Task</span>';
      })
      .saveTaskToSheet(taskObj);
  }
}

  if (drawer) {

    drawer.classList.add('translate-x-full');
  }
  setTimeout(function() {
    if (modal) modal.classList.add('hidden');

function quickUpdateStatus(taskId, newStatus) {
  var t = findTaskById(taskId);
  if (!t) return;
  
  var canEdit = isMD() || isSuperAdmin() || isManager() || (t.assignee === currentUser.username);
  if (!canEdit) {
    showToast('You do not have permission to change status of this task', 'error');
    renderView();
    return;
  }
  
  var prevStatus = t.status;
  var prevProgress = t.progress;
  
  t.status = newStatus;
  if (newStatus === 'Completed') {
    t.progress = 100;
  } else if (prevStatus === 'Completed' && t.progress === 100) {
    t.progress = 50;
  }
  
  showToast('Updating status to ' + newStatus + '...', 'info');
  renderView();
  
  var drawerModal = document.getElementById('detailModal');
  if (drawerModal && !drawerModal.classList.contains('hidden')) {
    openDetail(taskId);
  }

  google.script.run
    .withSuccessHandler(function(result) {
      showToast('Status updated to ' + newStatus, 'success');
      updateNotifications();
    })
    .withFailureHandler(function(err) {
      t.status = prevStatus;
      t.progress = prevProgress;
      renderView();
      showToast('Failed to update status: ' + (err.message || err), 'error');
    })
    .saveTaskToSheet(t);
}

function quickUpdatePriority(taskId, newPriority) {
  var t = findTaskById(taskId);
  if (!t) return;
  
  var canEdit = isMD() || isSuperAdmin() || isManager() || (t.assignee === currentUser.username);
  if (!canEdit) {
    showToast('You do not have permission to change priority of this task', 'error');
    renderView();
    return;
  }
  
  var prevPriority = t.priority;
  t.priority = newPriority;
  
  showToast('Updating priority to ' + newPriority + '...', 'info');
  renderView();
  
  var drawerModal = document.getElementById('detailModal');
  if (drawerModal && !drawerModal.classList.contains('hidden')) {
    openDetail(taskId);
  }

  google.script.run
    .withSuccessHandler(function(result) {
      showToast('Priority updated to ' + newPriority, 'success');
      updateNotifications();
    })
    .withFailureHandler(function(err) {
      t.priority = prevPriority;
      renderView();
      showToast('Failed to update priority: ' + (err.message || err), 'error');
    })
    .saveTaskToSheet(t);
}

function quickAssignTask(taskId, newAssignee) {
  var t = tasks.find(function(x){return x.id===taskId;});
  if (!t) return;
  
  var prevAssignee = t.assignee;
  t.assignee = newAssignee;
  
  // Optimistically update the avatar color & initials inside the modal
  var avatar = document.getElementById('quickAssignAvatar');
  if (avatar) {
    avatar.style.background = getUserColor(newAssignee);
    avatar.textContent = getUserInitials(newAssignee);
  }
  
  showToast('Reassigning task...', 'info');
  
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.success) {
        showToast('Task reassigned successfully!');
        renderView();
        updateNotifications();
      } else {
        t.assignee = prevAssignee;
        showToast('Reassignment failed: ' + (result.error || 'Unknown error'), 'error');
        openDetail(taskId);
      }
    })
    .withFailureHandler(function(err) {
      t.assignee = prevAssignee;
      showToast('Reassignment failed: ' + err.message, 'error');
      openDetail(taskId);
    })
    .saveTaskToSheet(t);
}

function getFileIcon(mimeType, fileName) {
  if (!mimeType) mimeType = '';
  if (!fileName) fileName = '';
  if (mimeType.indexOf('image') > -1) return '<i class="fas fa-file-image text-blue-400"></i>';
  if (mimeType.indexOf('pdf') > -1 || fileName.endsWith('.pdf')) return '<i class="fas fa-file-pdf text-red-400"></i>';
  if (mimeType.indexOf('sheet') > -1 || mimeType.indexOf('excel') > -1 || fileName.endsWith('.xlsx') || fileName.endsWith('.xls') || fileName.endsWith('.csv')) return '<i class="fas fa-file-excel text-green-400"></i>';
  if (mimeType.indexOf('word') > -1 || mimeType.indexOf('document') > -1 || fileName.endsWith('.doc') || fileName.endsWith('.docx')) return '<i class="fas fa-file-word text-blue-500"></i>';
  if (mimeType.indexOf('presentation') > -1 || fileName.endsWith('.ppt') || fileName.endsWith('.pptx')) return '<i class="fas fa-file-powerpoint text-orange-400"></i>';
  return '<i class="fas fa-file text-base-400"></i>';
}

function handleFileDrop(event, taskId) {
  event.preventDefault();
  event.currentTarget.classList.remove('border-amber-500');
  var files = event.dataTransfer.files;
  for (var i = 0; i < files.length; i++) {
    uploadFile(files[i], taskId);
  }
}

function handleFileSelect(event, taskId) {
  var files = event.target.files;
  for (var i = 0; i < files.length; i++) {
    uploadFile(files[i], taskId);
  }
  event.target.value = ''; // Reset so same file can be selected again
}

function uploadFile(file, taskId) {
  // Validate file size (10MB max)
  if (file.size > 10 * 1024 * 1024) {
    showToast('File "' + file.name + '" exceeds 10MB limit', 'error');
    return;
  }

  // Show upload progress
  var progressDiv = document.getElementById('uploadProgress');
  var statusText = document.getElementById('uploadStatusText');
  if (progressDiv) {
    progressDiv.classList.remove('hidden');
    statusText.textContent = 'Uploading "' + file.name + '"...';
  }

  var reader = new FileReader();
  reader.onload = function(e) {
    // Extract base64 (remove data:...;base64, prefix)
    var base64 = e.target.result.split(',')[1];
    
    var fileData = {
      taskId: taskId,
      fileName: file.name,
      mimeType: file.type || 'application/octet-stream',
      base64: base64,
      uploadedBy: currentUser.username
    };

    google.script.run
      .withSuccessHandler(function(result) {
        if (progressDiv) progressDiv.classList.add('hidden');
        if (result.success) {
          showToast('File "' + file.name + '" uploaded successfully!');
          loadAttachments(taskId); // Refresh attachments list
        } else {
          showToast('Upload failed: ' + (result.error || 'Unknown error'), 'error');
        }
      })
      .withFailureHandler(function(err) {
        if (progressDiv) progressDiv.classList.add('hidden');
        showToast('Upload failed: ' + err.message, 'error');
      })
      .uploadFileToTask(fileData);
  };
  reader.readAsDataURL(file);
}

function deleteAttachmentUI(attachId, taskId) {
  if (!confirm('Delete this attachment?')) return;
  
  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        showToast('Attachment deleted');
        loadAttachments(taskId);
      } else {
        showToast('Delete failed: ' + (result.error || 'Unknown error'), 'error');
      }
    })
    .withFailureHandler(function(err) {
      showToast('Delete failed: ' + err.message, 'error');
    })
    .deleteAttachment(attachId);
}

function addComment(taskId){
  var input=document.getElementById('newComment');
  var text=input.value.trim();
  if(text){
    var t=tasks.find(function(x){return x.id===taskId;});
    if(t){
      t.comments = t.comments || [];
      var commentObj = {
        username: currentUser ? currentUser.username : 'system',
        author: currentUser ? currentUser.name : 'System',
        role: currentUser ? currentUser.role : 'System',
        text: text,
        timestamp: formatCommentTimestamp(new Date())
      };
      t.comments.push(JSON.stringify(commentObj));
      // Save to sheet
      google.script.run
        .withSuccessHandler(function(){
          showToast('Comment saved to Sheet');
        })
        .withFailureHandler(function(err){
          showToast('Comment save failed: ' + err.message, 'error');
        })
        .saveTaskToSheet(t);
      showToast('Comment added');
      openDetail(taskId);
    }
  }
}

function deleteTask(id){
  var t = tasks.find(function(x){return x.id===id;});
  if(!t) return;
  var canDelete = isMD();
  if(canDelete){
    google.script.run
      .withSuccessHandler(function(result){
        if(result.success){
          tasks=tasks.filter(function(t){return t.id!==id;});
          showToast('Task deleted from Sheet','error');
          closeDetail(); renderView(); updateNotifications();
        } else {
          showToast('Delete failed: ' + (result.error||'Unknown error'), 'error');
        }
      })
      .withFailureHandler(function(err){
        showToast('Delete failed: ' + err.message, 'error');
      })
      .deleteTaskFromSheet(id);
  } else {
    showToast('Unauthorized','error');
  }
}

function updateSidebarVisibility() {
  if (!currentUser) return;
  var isSuper = isSuperAdmin();
  var isAdminLevel = !isSuper && isAdmin();
  var isMgr = isNamedManagerRole();

  function shouldShow(baseKey) {
    if (isSuper) return true;
    if (isAdminLevel) {
      if (baseKey === 'showSettings') return true; // Admins can always see/access Settings!
      return appSettings[baseKey + 'ToAdmins'] === 'true';
    }
    if (isMgr) return appSettings[baseKey + 'ToManagers'] === 'true';
    return appSettings[baseKey + 'ToUsers'] === 'true';
  }

  var showLogs = shouldShow('showLogs');
  document.getElementById('navLogsBtn').classList.toggle('hidden', !showLogs);

  var showAtt = shouldShow('showAttachments');
  document.getElementById('navAttachmentsBtn').classList.toggle('hidden', !showAtt);

  var showSettings = shouldShow('showSettings');
  document.getElementById('navSettingsBtn').classList.toggle('hidden', !showSettings);

  // Team visibility
  var showTeam = shouldShow('showTeam');
  var teamBtn = document.getElementById('navTeamBtn');
  if (teamBtn) {
    teamBtn.classList.toggle('hidden', !showTeam);
  }

  var showProjects = shouldShow('showProjects');
  var projectsBtn = document.getElementById('navProjectsBtn');
  if (projectsBtn) {
    projectsBtn.classList.toggle('hidden', !showProjects);
  }

  // Reports visibility for Admin, Manager, MD, and Super Admin
  var showReports = isAdmin() || isNamedManagerRole();
  var reportsBtn = document.getElementById('navReportsBtn');
  if (reportsBtn) {
    reportsBtn.classList.toggle('hidden', !showReports);
  }
}

function showConfirmDialog(message, onConfirm) {
  var dialog = document.getElementById('confirmDialog');
  var messageEl = document.getElementById('confirmDialogMessage');
  dialog.dataset.callback = onConfirm ? 'active' : '';
  messageEl.textContent = message;
  dialog.dataset.confirmCallback = onConfirm ? 'true' : '';
  dialog.__confirmHandler = onConfirm;
  dialog.classList.remove('hidden');
  dialog.classList.add('flex');
}

function hideConfirmDialog() {
  var dialog = document.getElementById('confirmDialog');
  dialog.classList.add('hidden');
  dialog.classList.remove('flex');
  dialog.__confirmHandler = null;
}

function confirmDialogConfirmed() {
  var dialog = document.getElementById('confirmDialog');
  if (dialog.__confirmHandler) {
    dialog.__confirmHandler();
  }
}
